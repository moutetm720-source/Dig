<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Cache Prevention & Freshness Meta Tags for all browsers & mobile devices -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Mobile Web App & Theme Color -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- TikTok Verification -->
    <meta name="tiktok-developers-site-verification" content="dTiIvuuOuUTqotkr0AI0bnTXPfP1QcVp" />
    <meta name="tiktok-site-verification" content="dTiIvuuOuUTqotkr0AI0bnTXPfP1QcVp" />
    
    <title>Nexus Digital Labs • Boutique Officielle de Produits Digitaux, Templates & Boilerplates IA</title>
    
    <!-- Core SEO Meta Tags -->
    <meta name="description" content="Découvrez nos templates Notion certifiés, boilerplates Next.js 15, prompts IA avancés et architectures logicielles autonomes. Téléchargement immédiat, licences commerciales et garantie 30 jours." />
    <meta name="keywords" content="digital products, templates Notion, prompt engineering, boilerplate Next.js, IA générative, SaaS starter kit, automatisation n8n, packs digitaux" />
    <meta name="author" content="Nexus Digital Labs" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://nexusdigitallabs.com/" />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexusdigitallabs.com/" />
    <meta property="og:title" content="Nexus Digital Labs • Produits Digitaux & Kits IA Haut Rendement" />
    <meta property="og:description" content="Kits prêts à l'emploi, code source Next.js 15, systèmes d'automatisation IA et templates de productivité. Accès instantané et paiement sécurisé Stripe & Crypto." />
    <meta property="og:site_name" content="Nexus Digital Labs" />
    <meta property="og:locale" content="fr_FR" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus Digital Labs • Produits Digitaux & Boilerplates IA" />
    <meta name="twitter:description" content="Accédez aux meilleurs systèmes de productivité, boilerplates logiciels et prompts IA testés sur le marché." />
    
    <!-- Rich Structured Data JSON-LD (Schema.org) for Search Engine Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://nexusdigitallabs.com/#website",
          "url": "https://nexusdigitallabs.com/",
          "name": "Nexus Digital Labs",
          "description": "Boutique en ligne autonome de produits digitaux, boilerplates et kits IA",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://nexusdigitallabs.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Store",
          "@id": "https://nexusdigitallabs.com/#store",
          "name": "Nexus Digital Labs",
          "url": "https://nexusdigitallabs.com/",
          "priceRange": "€9 - €290",
          "currenciesAccepted": "EUR, USD, GBP, JPY, CAD, BTC, ETH, SOL",
          "paymentAccepted": "Credit Card, Stripe, Crypto (BTC, ETH, SOL, USDT, USDC)",
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.9",
            "reviewCount": "128"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
